<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SkinVeda.ai — AI-assisted skin analysis, personalised skincare routines, ingredient guidance, optional product suggestions and access to dermatologists." />
    <meta name="keywords" content="AI skin analysis, skincare routine, acne, pigmentation, skincare ingredients, dermatologist consultation, India" />
    <meta property="og:title" content="SkinVeda.ai — Understand your skin. Build a better routine." />
    <meta property="og:description" content="AI-assisted skin analysis and personalised skincare guidance. Not a medical diagnosis." />
    <meta name="theme-color" content="#F8F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)" />
    <title>SkinVeda.ai — AI-assisted skincare guidance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode)
      (function () {
        try {
          var pref = localStorage.getItem('sv_theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
